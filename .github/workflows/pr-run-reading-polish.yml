name: Apply reading room polish

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-build-commit:
    if: github.head_ref == 'agent/polish-reading-room-20260805' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-reading-room-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Extract and run the prepared patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/one-off-polish-reading-room.yml').read_text(encoding='utf-8')
          start_marker = "          python3 - <<'PY'\n"
          end_marker = "\n          PY\n"
          start = source.index(start_marker) + len(start_marker)
          end = source.index(end_marker, start)
          lines = source[start:end].splitlines()
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'
          Path('/tmp/polish_reading_room.py').write_text(script, encoding='utf-8')
          PY
          python3 /tmp/polish_reading_room.py

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Commit tested polish
        shell: bash
        run: |
          rm .github/workflows/one-off-polish-reading-room.yml .github/workflows/pr-run-reading-polish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Root.jsx src/HomeHub.jsx src/ReadingHomeEntry.css src/ReadingRoom.jsx src/ReadingRoom.css .github/workflows
          git commit -m "Polish shared reading room UI"
          git push origin HEAD:agent/polish-reading-room-20260805
