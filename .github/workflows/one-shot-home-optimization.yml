name: One-shot OurHome optimization

on:
  push:
    branches:
      - agent/home-state-performance-20260810
    paths:
      - .github/one-shot-home-optimization.py
      - .github/workflows/one-shot-home-optimization.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Stage guarded OurHome optimization patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/home-state-performance-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded source patch
        run: python .github/one-shot-home-optimization.py
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:gomoku
      - run: npm run test:storage
      - run: npm run test:offline
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/ChatRoom.jsx scripts/app-shell-regression.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Harden Chat switching and scoped drafts"
          git push origin HEAD:agent/home-state-performance-20260810
