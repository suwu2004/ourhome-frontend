name: Frontend CI

on:
  push:
    branches:
      - main
      - agent/safe-api-json-20260805
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:gomoku
      - run: npm run test:storage
      - run: npm run test:offline
      - run: npm run test:app
      - run: npm run build
