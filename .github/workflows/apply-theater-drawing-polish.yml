name: Apply Theater Drawing Polish

on:
  push:
    branches:
      - feat/theater-chat-polish-drawing
    paths:
      - .github/workflows/apply-theater-drawing-polish.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/theater-chat-polish-drawing
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply source transforms
        run: node scripts/apply-theater-drawing-polish.mjs
      - name: Commit transformed source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Polish Theater chat and wire drawing room"
          git push origin HEAD:feat/theater-chat-polish-drawing
