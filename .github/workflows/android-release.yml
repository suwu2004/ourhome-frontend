name: Android Release

on:
  workflow_dispatch:

jobs:
  signed-apk:
    runs-on: ubuntu-latest
    env:
      VITE_BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run test:app
      - run: npm run android:sync
      - name: Prepare private release key
        env:
          OURHOME_KEYSTORE_BASE64: ${{ secrets.OURHOME_KEYSTORE_BASE64 }}
        run: |
          test -n "$OURHOME_KEYSTORE_BASE64"
          printf '%s' "$OURHOME_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ourhome-release.jks"
      - name: Build signed 1.0.2 APK
        working-directory: android
        env:
          OURHOME_RELEASE_KEYSTORE: ${{ runner.temp }}/ourhome-release.jks
          OURHOME_RELEASE_STORE_PASSWORD: ${{ secrets.OURHOME_RELEASE_STORE_PASSWORD }}
          OURHOME_RELEASE_KEY_ALIAS: ${{ secrets.OURHOME_RELEASE_KEY_ALIAS }}
          OURHOME_RELEASE_KEY_PASSWORD: ${{ secrets.OURHOME_RELEASE_KEY_PASSWORD }}
        run: ./gradlew verifyReleaseSigning assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OurHome-1.0.2-${{ github.sha }}-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
