name: One-off polish reading room

on:
  push:
    branches:
      - agent/polish-reading-room-20260805

permissions:
  contents: write

jobs:
  polish-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/polish-reading-room-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Polish reading room UI
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root_path = Path('src/Root.jsx')
          root = root_path.read_text(encoding='utf-8')
          old_root = '''  return (
    <>
      <HomeHub
        onOpen={openRoom}
        onRefresh={() => {
          setHomeRefreshToken(value => value + 1);
          refreshTheme();
        }}
        refreshToken={homeRefreshToken}
      />
      <button className="reading-home-entry" type="button" onClick={() => openRoom('reading')} aria-label="打开共读小屋">
        <i aria-hidden="true">📖</i><span>共读小屋</span>
      </button>
    </>
  );'''
          new_root = '''  return (
    <HomeHub
      onOpen={openRoom}
      onRefresh={() => {
        setHomeRefreshToken(value => value + 1);
        refreshTheme();
      }}
      refreshToken={homeRefreshToken}
    />
  );'''
          if old_root not in root:
              raise SystemExit('Root reading entry anchor not found')
          root_path.write_text(root.replace(old_root, new_root, 1), encoding='utf-8')

          home_path = Path('src/HomeHub.jsx')
          home = home_path.read_text(encoding='utf-8')
          if 'function BookIcon()' not in home:
              marker = '\nfunction OccasionReminder({ occasion }) {'
              book_icon = '''
function BookIcon() {
  return (
    <svg className="home-room-glyph" viewBox="0 0 36 36" aria-hidden="true">
      <path d="M5.5 8.5h10c1.8 0 2.5 1 2.5 2.8v17.2c0-1.8-.7-2.8-2.5-2.8h-10V8.5Zm25 0h-10c-1.8 0-2.5 1-2.5 2.8v17.2c0-1.8.7-2.8 2.5-2.8h10V8.5Z" />
      <path d="M9 13h5M22 13h5M9 17h5M22 17h5" />
    </svg>
  );
}
'''
              if marker not in home:
                  raise SystemExit('HomeHub icon anchor not found')
              home = home.replace(marker, book_icon + marker, 1)

          music_tile = '''            <button className="home-room-app home-room-app--music" type="button" onClick={() => onOpen('music')} aria-label="打开一起听">
              <span aria-hidden="true">♪</span>
              <strong>一起听</strong>
            </button>
'''
          reading_tile = '''            <button className="home-room-app home-room-app--reading" type="button" onClick={() => onOpen('reading')} aria-label="打开共读小屋">
              <span><BookIcon /></span>
              <strong>共读小屋</strong>
            </button>
'''
          if "onOpen('reading')" not in home:
              if music_tile not in home:
                  raise SystemExit('HomeHub music tile anchor not found')
              home = home.replace(music_tile, music_tile + reading_tile, 1)
          home_path.write_text(home, encoding='utf-8')

          entry_css = '''/* 共读小屋跟其他小功能一起悬浮在主页音符带里。 */
.home-music-garden .home-room-app--reading {
  top: 160px;
  left: 50%;
  width: 72px;
  margin-left: -36px;
  animation-delay: -2.8s;
}

.home-music-garden .home-room-app--reading > span {
  color: color-mix(in srgb, var(--home-honey-deep) 78%, var(--home-blush));
  background: color-mix(in srgb, var(--home-card-solid) 50%, transparent);
  border: 1px solid color-mix(in srgb, var(--home-honey) 30%, transparent);
  box-shadow: 0 7px 18px color-mix(in srgb, var(--home-shadow) 34%, transparent);
  backdrop-filter: blur(8px);
}

.home-music-garden .home-room-app--reading strong {
  color: color-mix(in srgb, var(--home-honey-deep) 82%, var(--home-ink));
}

@media (max-width: 560px) {
  .home-music-garden .home-room-app--reading {
    top: 126px;
    left: 50%;
    width: 66px;
    margin-left: -33px;
  }
}

@media (max-width: 370px) {
  .home-music-garden .home-room-app--reading {
    top: 120px;
    width: 62px;
    margin-left: -31px;
  }
}
'''
          Path('src/ReadingHomeEntry.css').write_text(entry_css, encoding='utf-8')

          room_path = Path('src/ReadingRoom.jsx')
          room = room_path.read_text(encoding='utf-8')
          room = room.replace(
              '  const readingPercent = activeBook ? progressForChapter(activeChapterIndex, activeBook.chapters.length) : 0;\n',
              '  const readingPercent = activeBook ? progressForChapter(activeChapterIndex, activeBook.chapters.length) : 0;\n  const currentShelfBook = books[0] || null;\n',
              1,
          )
          old_header = '<div><span>OUR LITTLE LIBRARY</span><h1>共读小屋</h1><p>把想一起读的文字，慢慢放进来。</p></div>'
          new_header = '<div><span>OUR LITTLE LIBRARY</span><h1>共读小屋</h1></div>'
          if old_header not in room:
              raise SystemExit('Reading shelf header anchor not found')
          room = room.replace(old_header, new_header, 1)

          old_intro = '''        <div className="reading-shelf-intro">
          <span>FIRST SHELF</span>
          <h2>我们正在读</h2>
          <p>第一阶段已经能导入 TXT、按日期或章节拆分，并替我们记住读到哪里。</p>
          <button type="button" onClick={() => fileInputRef.current?.click()} disabled={uploading}>{uploading ? '正在把书放上架…' : '导入一本 TXT'}</button>
        </div>'''
          new_intro = '''        <div className="reading-shelf-intro">
          <span>NOW READING</span>
          <h2>我们正在读</h2>
          {currentShelfBook ? (
            <>
              <strong className="reading-current-title">《{currentShelfBook.title}》</strong>
              <p className="reading-shelf-thought">“慢慢读，才不会漏掉你藏在日期里的小心情。”<em>—— 陆泽</em></p>
            </>
          ) : (
            <p className="reading-shelf-thought">书架还空着，点右上角的＋，把第一本想一起读的书放进来。</p>
          )}
        </div>'''
          if old_intro not in room:
              raise SystemExit('Reading intro anchor not found')
          room = room.replace(old_intro, new_intro, 1)

          cover_anchor = '''                <button className="reading-book-cover" type="button" onClick={() => openBook(book.id)}>
                  <span>{String(index + 1).padStart(2, '0')}</span>
                  <div><small>OUR BOOK</small><strong>{book.title}</strong><em>陆泽 ♡ 叶檀</em></div>
                </button>'''
          cover_new = '''                <button className="reading-book-cover" type="button" onClick={() => openBook(book.id)}>
                  <span>{String(index + 1).padStart(2, '0')}</span>
                  <b className="reading-cover-flower" aria-hidden="true">❦</b>
                  <div><small>OUR BOOK</small><strong>{book.title}</strong><em>陆泽 ♡ 叶檀</em></div>
                </button>'''
          if cover_anchor not in room:
              raise SystemExit('Reading cover anchor not found')
          room_path.write_text(room.replace(cover_anchor, cover_new, 1), encoding='utf-8')

          css_path = Path('src/ReadingRoom.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* ===== 2026-08-05 共读小屋细节优化 ===== */'
          if marker not in css:
              css += '''

/* ===== 2026-08-05 共读小屋细节优化 ===== */
.reading-shelf-header,
.reading-reader-header {
  min-height: 66px;
  padding: max(12px, env(safe-area-inset-top)) 15px 10px;
  grid-template-columns: 38px minmax(0, 1fr) 38px;
  gap: 10px;
}

.reading-shelf-header > button,
.reading-reader-header > button {
  width: 38px;
  height: 38px;
}

.reading-shelf-header h1 {
  margin: 1px 0 0;
  font-size: 21px;
  line-height: 1.25;
}

.reading-shelf-header span,
.reading-reader-header span {
  font-size: 8px;
  letter-spacing: .22em;
}

.reading-shelf-body {
  height: calc(100% - 66px);
  padding-top: 18px;
}

.reading-shelf-intro {
  padding: 19px 21px 18px;
}

.reading-shelf-intro h2 {
  margin-bottom: 2px;
}

.reading-current-title {
  display: block;
  max-width: calc(100% - 58px);
  margin: 2px 0 8px;
  overflow: hidden;
  font-size: 16px;
  font-weight: 500;
  line-height: 1.55;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.reading-shelf-thought {
  margin: 0 !important;
  padding-right: 30px;
  font-size: 12px !important;
  line-height: 1.8 !important;
}

.reading-shelf-thought em {
  display: block;
  margin-top: 3px;
  color: color-mix(in srgb, var(--reading-accent) 72%, var(--reading-muted));
  font-size: 10px;
  font-style: normal;
}

.reading-book-cover {
  background:
    radial-gradient(circle at 16% 18%, rgba(255, 245, 218, .16) 0 2px, transparent 3px),
    radial-gradient(circle at 82% 74%, rgba(255, 245, 218, .12) 0 2px, transparent 3px),
    linear-gradient(90deg, rgba(91, 55, 30, .16) 0 4px, transparent 4px 10px, rgba(255,255,255,.1) 10px 12px, transparent 12px),
    linear-gradient(145deg, color-mix(in srgb, var(--reading-accent) 78%, #e8bd87), color-mix(in srgb, var(--reading-accent) 48%, #76503a));
  background-size: 34px 34px, 42px 42px, auto, auto;
}

.reading-book-cover::before {
  inset: 9px;
  border: 1px solid rgba(255, 248, 226, .42);
  box-shadow:
    inset 0 0 0 4px rgba(255, 248, 226, .06),
    inset 0 0 0 5px rgba(255, 248, 226, .2);
}

.reading-book-cover::after {
  content: "✦  ·  ✦";
  inset: auto 17px 14px auto;
  width: auto;
  height: auto;
  border: 0;
  background: none;
  color: rgba(255, 248, 226, .48);
  font-size: 10px;
  letter-spacing: .12em;
}

.reading-cover-flower {
  position: absolute;
  top: 18px;
  left: 20px;
  z-index: 1;
  color: rgba(255, 248, 226, .58);
  font-size: 24px;
  font-weight: 400;
  transform: rotate(-12deg);
}

@media (max-width: 560px) {
  .reading-shelf-header,
  .reading-reader-header {
    padding-left: 14px;
    padding-right: 14px;
  }

  .reading-shelf-intro {
    border-radius: 21px;
  }
}

@media (max-width: 370px) {
  .reading-book-cover {
    aspect-ratio: 16 / 10;
    min-height: 0;
  }

  .reading-book-cover strong {
    font-size: 18px;
  }
}
'''
          css_path.write_text(css, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Commit polished reading room
        shell: bash
        run: |
          rm .github/workflows/one-off-polish-reading-room.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Root.jsx src/HomeHub.jsx src/ReadingHomeEntry.css src/ReadingRoom.jsx src/ReadingRoom.css .github/workflows/one-off-polish-reading-room.yml
          git commit -m "Polish shared reading room UI"
          git push origin HEAD:agent/polish-reading-room-20260805
