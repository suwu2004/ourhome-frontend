name: Wire native notification UI once

on:
  pull_request:
    types: [synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/native-notification-reminders-20260810'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded notification wiring
        run: python .github/one-shot-native-notification-wire.py
      - name: Remove one-shot scaffolding
        run: |
          rm .github/one-shot-native-notification-wire.py
          rm .github/workflows/one-shot-native-notification-wire.yml
      - run: npm ci
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit guarded wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Wire native notifications into settings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
