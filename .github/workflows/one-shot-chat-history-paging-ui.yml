name: One-shot Chat history paging UI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/chat-history-paging-ui-20260810'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded Chat paging UI patch once
        run: |
          if grep -q "CHAT_HISTORY_PAGE_SIZE = 240" src/App.jsx && grep -q "MAX_CACHED_MESSAGES_PER_SESSION" src/ChatRoom.jsx; then
            echo "Patch already applied; verification only."
          else
            python .github/one-shot-chat-history-paging-ui.py
          fi
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.jsx src/ChatRoom.jsx scripts/chat-history-paging-regression.test.mjs package.json
          git diff --cached --quiet && exit 0
          git commit -m "Page long Chat history"
          git push origin HEAD:${{ github.head_ref }}
