name: One-shot Luze folder render optimization

on:
  push:
    branches:
      - agent/luze-folder-render-optimization-20260810
    paths:
      - .github/one-shot-luze-folder-render-opt.py
      - .github/workflows/one-shot-luze-folder-render-opt.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Run guarded Luze folder optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/luze-folder-render-optimization-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded optimization
        run: python .github/one-shot-luze-folder-render-opt.py
      - run: npm ci
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/LuzePrivateRoom.jsx scripts/data-room-polish-regression.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Optimize Luze day folder rendering"
          git push origin HEAD:agent/luze-folder-render-optimization-20260810
