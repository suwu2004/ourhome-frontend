name: One-shot API usage console move

on:
  push:
    branches: [agent/api-usage-console-20260810]

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/api-usage-console-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply API usage console move once
        run: python .github/one-shot-api-usage-console.py
      - run: npm ci --ignore-scripts
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified product patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ApiUsageLogPanel.jsx src/SettingsRoom.jsx scripts/api-usage-console-regression.test.mjs package.json
          git diff --cached --quiet && exit 0
          git commit -m "Move API usage into settings console"
          git push origin HEAD:agent/api-usage-console-20260810
