name: One-shot adaptive cloud recheck optimization

on:
  push:
    branches:
      - agent/adaptive-cloud-recheck-20260810
    paths:
      - .github/one-shot-adaptive-cloud-recheck.py
      - .github/workflows/one-shot-adaptive-cloud-recheck.yml
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event_name == 'pull_request' || github.event.head_commit.message == 'Stage adaptive cloud recheck optimization'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/adaptive-cloud-recheck-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded optimization patch once
        run: |
          if grep -q "STALE_RECHECK_BACKOFF_MS" src/CloudSyncBadge.jsx && grep -q "One stale-cache fallback is enough evidence" src/api.js; then
            echo "Optimization already applied; verification only."
          else
            python .github/one-shot-adaptive-cloud-recheck.py
          fi
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/CloudSyncBadge.jsx src/api.js scripts/api-fetch-regression.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Back off stale cloud rechecks adaptively"
          git push origin HEAD:agent/adaptive-cloud-recheck-20260810
