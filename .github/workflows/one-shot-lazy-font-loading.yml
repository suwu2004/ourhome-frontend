name: One-shot lazy font loading optimization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lazy-font-loading-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded lazy-font patch once
        run: |
          if grep -q "ensureFontLoaded" src/fonts.js && ! grep -q "preloadFontOptions" src/fonts.js; then
            echo "Lazy font optimization already applied; verification only."
          else
            python .github/one-shot-lazy-font-loading.py
          fi
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/fonts.js src/App.jsx src/Root.jsx src/LuzePrivateRoom.jsx src/SettingsRoom.jsx scripts/font-loading-regression.test.mjs package.json
          git diff --cached --quiet && exit 0
          git commit -m "Load optional Chinese fonts on demand"
          git push origin HEAD:agent/lazy-font-loading-20260810
