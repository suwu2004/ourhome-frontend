name: One-shot cloud sync self-heal

on:
  push:
    branches:
      - agent/cloud-sync-self-heal-20260810
    paths:
      - .github/one-shot-cloud-sync-self-heal.py
      - .github/workflows/one-shot-cloud-sync-self-heal.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Stage cloud sync self-heal patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/cloud-sync-self-heal-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded cloud-sync patch
        run: python .github/one-shot-cloud-sync-self-heal.py
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/api.js src/CloudSyncBadge.jsx scripts/api-fetch-regression.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Self-heal stale cloud sync status"
          git push origin HEAD:agent/cloud-sync-self-heal-20260810

# trigger: second push after workflow registration
