name: Android APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - android/**
      - capacitor.config.ts
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - .env.android
  push:
    branches: [main]
    paths:
      - android/**
      - capacitor.config.ts
      - src/**
      - public/**
      - package.json
      - package-lock.json
      - .env.android

jobs:
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run test:app
      - run: npm run android:sync
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OurHome-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Restore release keystore
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.OURHOME_RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ourhome-release.jks"
      - name: Build signed release APK
        if: github.event_name != 'pull_request'
        working-directory: android
        env:
          OURHOME_RELEASE_KEYSTORE: ${{ runner.temp }}/ourhome-release.jks
          OURHOME_RELEASE_STORE_PASSWORD: ${{ secrets.OURHOME_RELEASE_STORE_PASSWORD }}
          OURHOME_RELEASE_KEY_ALIAS: ${{ secrets.OURHOME_RELEASE_KEY_ALIAS }}
          OURHOME_RELEASE_KEY_PASSWORD: ${{ secrets.OURHOME_RELEASE_KEY_PASSWORD }}
        run: ./gradlew verifyReleaseSigning assembleRelease --no-daemon
      - name: Upload signed release APK
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: OurHome-Android-release-signed
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
