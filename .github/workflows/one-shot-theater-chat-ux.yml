name: One-shot theater chat UX

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/theater-chat-ux-20260810'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded theater UX patch once
        run: |
          if grep -q "选择小剧场模型" src/TheaterRoom.jsx && grep -q "hasWorldSetup" src/TheaterRoom.jsx; then
            echo "Patch already applied; verification only."
          else
            python .github/one-shot-theater-chat-ux.py
          fi
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/TheaterRoom.jsx scripts/theater-chat-ux-regression.test.mjs package.json
          git diff --cached --quiet && exit 0
          git commit -m "Open existing theater worlds in chat"
          git push origin HEAD:${{ github.head_ref }}
