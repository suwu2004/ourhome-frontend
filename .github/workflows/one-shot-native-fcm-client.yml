name: One-shot native FCM client

on:
  push:
    branches: [agent/native-fcm-client-20260810]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.head_ref == 'agent/native-fcm-client-20260810' || github.ref == 'refs/heads/agent/native-fcm-client-20260810'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/native-fcm-client-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Apply JS/UI FCM wiring once
        run: |
          if grep -q "openRemotePushTarget" src/Root.jsx; then
            echo "Native FCM UI patch already applied; verification only."
          else
            python .github/one-shot-native-fcm-client.py
          fi
      - run: npm ci
      - run: npm run test:app
      - run: npm run build
      - run: npm run android:sync
      - name: Compile Android debug APK without Firebase secrets
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: git diff --check
      - name: Commit verified product patch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Root.jsx src/App.jsx src/SettingsRoom.jsx src/nativeNotifications.js scripts/native-fcm-push-regression.test.mjs package.json .github/workflows/android-apk.yml .gitignore android/variables.gradle android/app/build.gradle android/app/src/main/AndroidManifest.xml android/app/src/main/java/com/ourhome/app/MainActivity.java android/app/src/main/java/com/ourhome/app/OurHomeNotificationsPlugin.java android/app/src/main/java/com/ourhome/app/OurHomeFirebaseMessagingService.java
          git diff --cached --quiet && exit 0
          git commit -m "Add private Android FCM notifications"
          git push origin HEAD:agent/native-fcm-client-20260810
