name: One-shot persistent core patch

on:
  push:
    branches:
      - codex/fix-chat-persistence-mobile-header-20260810
    paths:
      - .github/patch-persistent-core.py
      - .github/workflows/one-shot-persistent-core.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/fix-chat-persistence-mobile-header-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded source patch
        run: python .github/patch-persistent-core.py
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:gomoku
      - run: npm run test:storage
      - run: npm run test:offline
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Root.jsx src/App.jsx scripts/app-shell-regression.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Keep core rooms and Chat sessions alive"
          git push origin HEAD:codex/fix-chat-persistence-mobile-header-20260810
