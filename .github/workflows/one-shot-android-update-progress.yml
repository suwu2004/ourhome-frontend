name: One-shot Android update progress

on:
  push:
    branches:
      - agent/android-update-progress-20260810
    paths:
      - .github/one-shot-android-update-progress.py
      - .github/workflows/one-shot-android-update-progress.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    if: github.event.head_commit.message == 'Stage Android update progress patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/android-update-progress-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Apply guarded updater progress patch
        run: python .github/one-shot-android-update-progress.py
      - run: npm ci
      - run: npm run test:app
      - run: npm run build
      - run: npm run android:sync
      - name: Compile Android debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AppInstallSettings.jsx src/appUpdate.js android/app/src/main/java/com/ourhome/app/OurHomeUpdaterPlugin.java scripts/app-shell-regression.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Show Android update download progress"
          git push origin HEAD:agent/android-update-progress-20260810

# trigger after workflow registration
