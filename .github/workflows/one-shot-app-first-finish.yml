name: One-shot app-first finishing patch

on:
  push:
    branches:
      - agent/app-first-recovery-updater-20260810
    paths:
      - .github/one-shot-app-first-finish.py
      - .github/workflows/one-shot-app-first-finish.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Stage app-first finishing patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/app-first-recovery-updater-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded patch
        run: python .github/one-shot-app-first-finish.py
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:gomoku
      - run: npm run test:storage
      - run: npm run test:offline
      - run: npm run test:app
      - run: npm run build
      - name: Check patch whitespace
        run: git diff --check
      - name: Remove one-shot scaffolding and commit source
        shell: bash
        run: |
          set -euo pipefail
          rm .github/one-shot-app-first-finish.py .github/workflows/one-shot-app-first-finish.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Finish app-first recovery and resilient updater'
          git push origin HEAD:agent/app-first-recovery-updater-20260810
