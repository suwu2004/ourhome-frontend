name: One-shot lazy settings connection groups

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/lazy-settings-connections-20260810
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply guarded lazy-settings patch once
        run: |
          if grep -q "childrenMounted ? children : null" src/SettingsGroup.jsx && grep -q "settings-lazy-mount-regression" package.json; then
            echo "Lazy settings optimization already applied; verification only."
          else
            python .github/one-shot-lazy-settings-connections.py
          fi
      - run: npm ci
      - run: npm run test:api
      - run: npm run test:app
      - run: npm run build
      - run: git diff --check
      - name: Commit verified product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/SettingsGroup.jsx src/SettingsRoom.jsx scripts/settings-lazy-mount-regression.test.mjs package.json
          git diff --cached --quiet && exit 0
          git commit -m "Mount connection settings only when opened"
          git push origin HEAD:agent/lazy-settings-connections-20260810
