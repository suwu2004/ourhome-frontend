name: One-off reading room wiring

on:
  push:
    branches:
      - agent/reading-room-phase1-20260805

permissions:
  contents: write

jobs:
  wire-build-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reading-room-phase1-20260805
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Add the room tile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/HomeHub.jsx')
          text = path.read_text(encoding='utf-8')
          anchor = '''            <button className="home-room-app home-room-app--music" type="button" onClick={() => onOpen('music')} aria-label="打开一起听">
              <span aria-hidden="true">♪</span>
              <strong>一起听</strong>
            </button>
'''
          tile = '''            <button className="home-room-app home-room-app--letters home-room-app--reading" type="button" onClick={() => onOpen('reading')} aria-label="打开共读小屋">
              <span>
                <svg className="home-room-glyph" viewBox="0 0 36 36" aria-hidden="true">
                  <path d="M5.5 8.5h10c1.8 0 2.5 1 2.5 2.8v17.2c0-1.8-.7-2.8-2.5-2.8h-10V8.5Zm25 0h-10c-1.8 0-2.5 1-2.5 2.8v17.2c0-1.8.7-2.8 2.5-2.8h10V8.5Z" />
                  <path d="M9 13h5M22 13h5M9 17h5M22 17h5" />
                </svg>
              </span>
              <strong>共读小屋</strong>
            </button>
'''
          if "onOpen('reading')" not in text:
              if text.count(anchor) != 1:
                  raise SystemExit('music room tile anchor not found exactly once')
              text = text.replace(anchor, anchor + tile, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install dependencies
        run: npm ci

      - name: Build production frontend
        run: npm run build

      - name: Commit tested reading room
        shell: bash
        run: |
          rm .github/workflows/one-off-reading-phase1.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Root.jsx src/HomeHub.jsx src/ReadingRoom.jsx src/ReadingRoom.css .github/workflows/one-off-reading-phase1.yml
          git commit -m "Add shared reading room foundation"
          git push origin HEAD:agent/reading-room-phase1-20260805
